<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>网页标题</title>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelector("article").textContent = "页面脚本已经执行";
    });
  </script>
</head>
<body>
  <nav>首页 产品 价格 登录</nav>
  <aside>广告：这部分不应该进入正文。</aside>
  <main>
    <article>
      <h1>离线听读为什么重要</h1>
      <p>许多人保存了大量文章，却没有连续坐下来阅读的时间。把内容转换成自然音频，可以利用通勤、走路和整理房间的时间继续学习。</p>
      <p>真正有用的产品不只是把文字念出来，还应当保留来源、播放进度和局部修改能力，让用户下一次打开时能从上次的位置继续。</p>
      <p>所有私人资料默认留在本机，能减少上传敏感内容时的顾虑；网页获取结束后，语音生成和项目保存仍然可以离线完成。</p>
    </article>
  </main>
  <section class="comments">评论区：这部分不应该进入正文。</section>
  <footer>版权、备案号和无关链接。</footer>
